<!-- <!DOCTYPE html> tells the browser that this document is an HTML5 document. -->
<!DOCTYPE html>

<!-- <html> is the root element of the HTML page, with lang="en" specifying English language. -->
<html lang="en">

<!-- <head> contains meta-information about the webpage that is not directly shown on the main body. -->
<head>
  <!-- <meta charset="UTF-8"> specifies the character encoding for the HTML document to UTF-8. -->
  <meta charset="UTF-8">

  <!-- <meta name="viewport"> configures the page viewport so it renders properly on all screen sizes/mobile devices. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- <title> defines the title of the webpage displayed in the browser tab. -->
  <title>My First Web Page</title>
</head>

<!-- <body> contains all the visible content of the HTML document shown to the user. -->
<body>

  <!-- <header> defines a header section for the top of the webpage. -->
  <header>
    <!-- <h1> defines the main heading of the webpage. -->
    <h1>Student Information Page</h1>
  </header>

  <!-- <main> specifies the main content area of the document. -->
  <main>
    <!-- <p> creates a paragraph displaying the student's full name/username. -->
    <p><strong>Name / Username:</strong> Tuan Cuong Pham</p>

    <!-- <p> creates a paragraph displaying the course name. -->
    <p><strong>Course Name:</strong> Intro to Website Development</p>

    <!-- <p> creates a paragraph displaying the course number. -->
    <p><strong>Course Number:</strong> IS 117</p>

    <!-- <p> creates a paragraph displaying the course section. -->
    <p><strong>Course Section:</strong> 003</p>
  </main>

  <!-- <footer> defines the footer section at the bottom of the page. -->
  <footer>
    <!-- <p> contains footer details including the copyright symbol (&copy;), student name, and due date. -->
    <p>&copy; 2026 Tuan Cuong Pham | Due Date: October 6, 2026</p>
  </footer>

<!-- </body> closes the body element. -->
</body>

<!-- </html> closes the root HTML element. -->
</html>
